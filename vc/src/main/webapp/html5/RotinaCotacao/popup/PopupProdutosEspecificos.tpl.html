        <button default styleName="btnAlerta">
            <sk-icon class="icon-alert" font-icon="alert"></sk-icon>
        </button>
        <label styleName="alertIcon" sk-width="100%"
            sk-translate>Cotacao.RotinaCotacao.msgNaoGeraPedidoSemInfoProdEsp</label>
